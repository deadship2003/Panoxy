# =====================================================================
# panixy 通用配置模板 v0.1.4
# ★ 全文件只有一处必须修改: 搜索 SUB_URL_PLACEHOLDER
#   改法一(推荐): sudo panixy set-sub '你的订阅链接'
#       (无外网环境可离线导入: panixy set-sub '链接' <下载好的订阅文件>)
#   改法二: 手工把 SUB_URL_PLACEHOLDER 整个替换成订阅链接(保留引号)
#
# 地区分组用常见机场命名正则匹配(香港/台湾/日本/新加坡/韩国/美国/其他地区),
# 不中或想细分,改 proxy-groups 里各组的 filter 即可。
# 本模板已内置稳定性修复: tun.stack=gvisor / prefer-h3=false / 无fallback段。
# v0.1.3: 国内组默认 DIRECT / 删除已失效的 global-client-fingerprint(内核已移除)
#         / 删除 external-ui-url(面板更新由 panixy upgrade 接管)
#         / 开启 geo 自动更新 / 广告规则改为每日拉取。
# v0.1.4: SUB 订阅落盘到 path(panixy set-sub 预置缓存,无外网也能秒级加载)
#         / 境外域名真实解析经 dns 组(默认 🔃 自动选择 = 自动测速最快节点)走 DoH
#         / NTP 换国内源(网关环境 time.apple.com 的 UDP 常被扰动)。
# =====================================================================

# ============ 锚点模板(&pr 服务组 / &prd 国内组 / &p 订阅健康检查 / &use 地区组)============
pr:
  &pr {
    type: select,
    proxies: [🔃 自动选择, 香港, 台湾, 日本, 新加坡, 韩国, 美国, 其他地区, 全部节点, DIRECT],
    use: [SUB],
  }
# 国内组:DIRECT 放第一位(默认直连,国内流量不走代理;要代理手动切)
prd:
  &prd {
    type: select,
    proxies: [DIRECT, 🔃 自动选择, 香港, 台湾, 日本, 新加坡, 韩国, 美国, 其他地区, 全部节点],
    use: [SUB],
  }
# 延迟检测模板
p:
  &p {
    type: http,
    interval: 360,
    health-check:
      {
        enable: true,
        lazy: false,
        url: https://www.gstatic.com/generate_204/,
        interval: 240,
        timeout: 1000,
        tolerance: 100,
      },
  }
# 地区组模板(引用名为 SUB 的订阅)
use: &use
  type: select
  use:
    - SUB

# ============ 订阅源(唯一必改处)============
proxy-providers:
  SUB:
    <<: *p
    url: "SUB_URL_PLACEHOLDER"   # ←←← 把订阅链接粘进来,或用 panixy set-sub
    path: ./proxies/SUB.yaml     # 订阅落盘位:panixy set-sub 预取预置到这里,内核重启秒级加载不依赖网络

# ============ 基础设置 ============
mixed-port: 33833
socks-port: 6696
allow-lan: true
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
tcp-fast-open: true
# 网关/路由器请保持 off(不匹配进程,转发流量无进程信息)
find-process-mode: off
keep-alive-interval: 30
# 注:global-client-fingerprint 已被内核移除(启动会报 error),节点级指纹在节点里配 client-fingerprint

# ============ 外部控制 / 面板 ============
external-controller: 0.0.0.0:9999
external-ui: ui/official
# secret 安装器会自动替换为随机密钥;手工部署请自行改成自己的密钥
secret: deadship

# ============ Geo 数据 ============
geodata-mode: true
geo-auto-update: true          # 内核自动更新 geo(经代理),分流规则不过期
geo-update-interval: 24        # 小时
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# ============ 缓存 ============
profile:
  store-selected: true
  store-fake-ip: true

# ============ NTP ============
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com   # 国内网关 time.apple.com(UDP 123)常被扰动
  port: 123
  interval: 30

# ============ 域名嗅探 ============
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# ============ TUN 透明代理 ============
tun:
  enable: true
  stack: gvisor            # 稳定性优先:链路事件后不易卡死
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

iptables:
  enable: false

# ============ DNS ============
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  prefer-h3: false          # DoH 走 H2/TCP,UDP 被扰动时 DNS 不陪葬
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.direct"
    - time.windows.com
    - ntp.*
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  # 境外域名真实解析:经 dns 组走 DoH(#后缀=指定出站组,dns 组默认 🔃 自动选择=最快节点)。
  # fake-ip 模式下客户端拿到的都是假 IP,这里仅在内核需要真实 IP 时触发;流量转发由节点远端解析。
  # 1.1.1.1 为 IP 直连 DoH,无需先解析 DNS 服务器域名(无订阅时此路不通,CN 域名不受影响)。
  nameserver:
    - https://1.1.1.1/dns-query#dns
  # 订阅域名/节点服务器域名:必须国内直连可解析(引导期唯一的 DNS 生命线,勿改走代理)
  proxy-server-nameserver:
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - 223.5.5.5
      - 119.29.29.29

# ============ 策略分组 ============
proxy-groups:
  # dns 组:上方 nameserver 里 DoH 的出站口(#dns 后缀),默认走 🔃 自动选择(自动测速最快节点)
  # 刻意不含 DIRECT(避免被墙域名走直连无法解析)
  - { name: dns, type: select, use: [SUB], proxies: [🔃 自动选择, 香港, 台湾, 日本, 新加坡, 韩国, 美国, 全部节点] }
  - { name: 🚀 节点选择, <<: *pr }
  - { name: 学术, <<: *pr }
  - { name: 境外AI, <<: *pr }
  - { name: 广告拦截, type: select, proxies: [REJECT, DIRECT, 🚀 节点选择] }
  - { name: TikTok, <<: *pr }
  - { name: 🎥 油管视频, <<: *pr }
  - { name: 🤖 ChatGPT, <<: *pr }
  - { name: 🍎 苹果服务, <<: *pr }
  - { name: Ⓜ️ 微软云盘, <<: *pr }
  - { name: Ⓜ️ 微软, <<: *pr }
  - { name: 🎮 游戏平台, <<: *pr }
  - { name: 📢 谷歌FCM, <<: *pr }
  - { name: 📲 电报服务, <<: *pr }
  - { name: Twitter, <<: *pr }
  - { name: Copilot, <<: *pr }
  - { name: Synology, <<: *pr }
  - { name: qBitorrent, <<: *pr }
  - { name: 🎥 网飞视频, <<: *pr }
  - { name: 国内, <<: *prd }
  - { name: Spotify, <<: *pr }
  - { name: 🔍 GitHub, <<: *pr }
  # 兜底组:所有规则没匹配到的流量
  - { name: 其他, <<: *pr }

  # ===== 地区分组(通配常见机场命名,不中可改各组的 filter)=====
  - { name: 香港, <<: *use, type: url-test, filter: '(?i)港|HK|Hong ?Kong' }
  - { name: 台湾, <<: *use, type: url-test, filter: '(?i)台|新北|彰化|TW|Taiwan' }
  - { name: 日本, <<: *use, type: url-test, filter: '(?i)日本|东京|東京|大阪|埼玉|JP|Japan|Tokyo|Osaka' }
  - { name: 新加坡, <<: *use, type: url-test, filter: '(?i)新加坡|狮城|SG|Singapore' }
  - { name: 韩国, <<: *use, type: url-test, filter: '(?i)韩|首尔|KR|Korea|Seoul' }
  - { name: 美国, <<: *use, type: url-test, filter: '(?i)美国|美西|美东|States|America|洛杉矶|圣何塞|西雅图' }
  - { name: 其他地区, <<: *use, type: url-test, filter: '(?i)马来|泰国|越南|菲律宾|印尼|印度|土耳其|德国|英国|法国|荷兰|俄罗斯|巴西|阿根廷|Malaysia|Thailand|Vietnam|Philippines|Indonesia|Turkey|Germany|Russia|Brazil|Argentina' }
  - { name: 全部节点, <<: *use }
  - { name: 🔃 自动选择, <<: *use, tolerance: 2, type: url-test }

# ============ 规则订阅 ============
rule-providers:
  # 秋风广告拦截规则 https://awavenue.top
  # 源站在 raw.githubusercontent.com(国内直连不可达):离线包已预置同名缓存文件,
  # 首启离线可用;之后内核刷新订阅/规则时流量经自身规则走节点,自动恢复正常更新
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: yaml
    path: ./rule_provider/AWAvenue-Ads.yaml
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    interval: 86400   # 每日全量拉取已足够(单位:秒)

# ============ 分流规则 ============
rules:
  - GEOSITE,TikTok,TikTok
  - DOMAIN-SUFFIX,chatgpt.com,🤖 ChatGPT
  - DOMAIN-SUFFIX,oaistatic.com,🤖 ChatGPT
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 ChatGPT
  - DOMAIN-SUFFIX,openai.com,🤖 ChatGPT
  - DOMAIN-SUFFIX,openai.com.cdn.cloudflare.net,🤖 ChatGPT
  - DOMAIN-SUFFIX,openaiapi-site.azureedge.net,🤖 ChatGPT
  - DOMAIN-SUFFIX,openaicom-api-bdcpf8c6d2e9atf6.z01.azurefd.net,🤖 ChatGPT
  - DOMAIN-SUFFIX,openaicomproductionae4b.blob.core.windows.net,🤖 ChatGPT
  - DOMAIN-SUFFIX,production-openaicom-storage.azureedge.net,🤖 ChatGPT
  - RULE-SET,AWAvenue-Ads,广告拦截
  - GEOSITE,category-scholar-!cn,学术
  - GEOSITE,category-ai-!cn,境外AI
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,🎮 游戏平台
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,onedrive,Ⓜ️ 微软云盘
  - GEOSITE,apple-cn,🍎 苹果服务
  - GEOSITE,github,🔍 GitHub
  - GEOSITE,twitter,Twitter
  - DOMAIN-KEYWORD,synology,Synology
  - DOMAIN-KEYWORD,copilot,Copilot
  - GEOSITE,bing,Ⓜ️ 微软
  - GEOSITE,microsoft,Ⓜ️ 微软
  - GEOSITE,msn,Ⓜ️ 微软
  - GEOSITE,youtube,🎥 油管视频
  - GEOSITE,google,📢 谷歌FCM
  - GEOSITE,google-cn,📢 谷歌FCM
  - GEOSITE,telegram,📲 电报服务
  - GEOSITE,netflix,🎥 网飞视频
  - GEOSITE,spotify,Spotify
  - GEOSITE,geolocation-!cn,其他
  - AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOIP,CN))),REJECT # quic
  - GEOIP,google,📢 谷歌FCM
  - GEOIP,netflix,🎥 网飞视频
  - GEOIP,telegram,📲 电报服务
  - GEOIP,twitter,Twitter
  - GEOSITE,CN,国内
  - GEOIP,CN,国内
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - MATCH,其他
